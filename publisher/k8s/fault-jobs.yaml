apiVersion: batch/v1
kind: Job
metadata:
  name: daily-edition-invalid-json
  namespace: daily-edition
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: test
          image: daily-edition-runtime:REPLACE_WITH_IMMUTABLE_TAG
          command: [python3, /opt/publisher/tests/fault_job.py, invalid-json]
          env:
            - {name: HOME, value: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: temp, mountPath: /tmp}
      volumes:
        - name: temp
          emptyDir: {}
---
